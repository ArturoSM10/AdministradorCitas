<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador Citas</title>

    <link rel="stylesheet" href="./dist/css/style.css">
</head>
<body>
    <header class="header">
        <h1 class="header__title">Administrador de pacientes de veterinaria</h1>
    </header>
    <main class="main">
        <div class="main__contenedor">
            <form class="form">
                <legend>Datos del paciente</legend>
                <fieldset class="datos">
                    <div class="campo">
                        <label for="mascota">Nombre mascota: </label>
                        <input placeholder="Nombre mascota" type="text" name="mascota" id="mascota">
                    </div>
                    
                    <div class="campo">
                        <label for="propietario">Propietario: </label>
                        <input placeholder="Nombre dueño de la mascota" type="text" name="propietario" id="propietario">
                    </div>
    
                    <div class="campo">
                        <label for="telefono">telefono: </label>
                        <input placeholder="Numero de teléfono" type="tel" name="telefono" id="telefono">
                    </div>
    
                    <div class="campo">
                        <label for="fecha">fecha: </label>
                        <input type="date" name="fecha" id="fecha">
                    </div>
    
                    <div class="campo">
                        <label for="hora">Hora: </label>
                        <input type="time" name="hora" id="hora">
                    </div>
    
                    <div class="campo">
                        <label for="sintomas">Sintomas: </label>
                        <textarea name="sintomas" id="sintomas"></textarea>
                    </div>
                </fieldset>
                <button class="submit" type="submit">Crear cita</button>
            </form>
    
            <section class="administrador">
                <h2 class="administrador__title">Administra tus citas</h2>
                <ul class="administrador__ul">
                </ul>
            </section>
        </div>
    </main>
    <script src="./dist/js/app.js"></script>
</body>
</html>
